<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Resolve and apply the theme before first paint, so there's no
      // flash of the wrong theme. Keep 'hub.theme' in sync with
      // THEME_STORAGE_KEY in src/lib/theme.ts — this can't import that
      // module since it has to run synchronously, standalone, this early.
      ;(function () {
        try {
          var stored = localStorage.getItem('hub.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            // Approximate; src/lib/theme.ts's updateThemeColorMeta()
            // corrects this to the exact computed color once React mounts.
            if (meta) meta.setAttribute('content', '#18181d')
          }
        } catch (e) {
          // localStorage/matchMedia unavailable; fall back to light.
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Hub - capture, organize, and triage every project idea, from small sparks to standalone builds."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <title>Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
