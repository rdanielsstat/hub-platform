# nginx for the local Docker Compose stack, standing in for CloudFront:
# serves the built SPA and forwards /api/* to the backend with the /api
# prefix removed (Mangum strips it when deployed). See frontend/Dockerfile.

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    # No nginx version in the Server header or error pages.
    server_tokens off;

    # The security headers CloudFront adds (infra/hub/frontend.tf), minus
    # the two that only make sense over HTTPS: HSTS, and the CSP's
    # upgrade-insecure-requests, which would send this http://localhost
    # page's requests to https://localhost. Keep the rest in step with
    # local.content_security_policy there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's DNS, re-resolved, so a recreated app container (new IP)
    # doesn't leave nginx proxying to the old one. A variable in
    # proxy_pass is what makes nginx resolve at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://app:8000;

    # ^~ so the file-extension rule below never captures an API path.
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Like the CloudFront Function (spa_router in infra/hub/frontend.tf):
    # a path with a file extension is a file, and a 404 if it's missing;
    # anything else is a client-side route and gets index.html.
    location ~ \.[^/]*$ {
        try_files $uri =404;
    }

    location / {
        try_files /index.html =404;
    }
}
