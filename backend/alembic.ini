# Alembic configuration for the CLI (`uv run alembic ...` from backend/).
#
# The database URL is deliberately not set here: alembic/env.py resolves
# it the same way the app does (app/core/config.py's get_database_url():
# DATABASE_URL, or SSM with USE_SSM on), after loading backend/.env. So
# `uv run alembic upgrade head` targets whatever database the app would.
#
# The bootstrap and init_local don't read this file at all: they run
# migrations through app/db/migrations.py, which builds its own config
# (same script location) and leaves the process's logging alone.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
