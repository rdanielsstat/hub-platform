[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.98",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` runs the unit tests only (in-memory SQLite, no
# services). `uv run pytest -m integration` runs tests/integration/,
# which needs the Docker Compose Postgres (`make docker-up` or
# `docker compose up -d postgres` from the repo root). A later -m on the
# command line replaces this one.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real Postgres (Docker Compose); deselected by default",
]
filterwarnings = [
    # Mangum 0.22.0 (latest as of 2026-10-02) calls asyncio.get_event_loop()
    # and creates a loop itself when that raises RuntimeError, which is the
    # behaviour newer Pythons switch to. Python 3.12 warns on the call first.
    # Harmless, and nothing to upgrade to; scoped to this one message from
    # mangum.adapter so any other deprecation still shows. Drop this once a
    # Mangum release stops calling get_event_loop().
    "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]
