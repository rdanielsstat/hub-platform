# Local git hooks, run by https://pre-commit.com before each commit.
#
# One-time setup per clone (from the repo root):
#   uvx pre-commit install
# (or `pipx install pre-commit` / `brew install pre-commit`, then
# `pre-commit install`). After that, every `git commit` scans the staged
# changes for secrets with gitleaks and blocks the commit on a hit.
#
# The gitleaks hook builds gitleaks from source on first run; pre-commit
# downloads its own Go toolchain for that, so no local Go install is needed.
#
# Scan the whole working tree by hand:  uvx pre-commit run --all-files
# Bump the pinned version:              uvx pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
