# Prod-parity local stack: the whole system, with the backend on real
# Postgres instead of the SQLite default. Open http://localhost:8080:
# nginx serves the production frontend build and forwards /api/* to the
# backend, as CloudFront does when deployed (frontend/nginx.conf). The
# API is also published on :8000 for the Playwright API tests and
# direct calls. A plain `uv run uvicorn app.main:app --reload` (no
# Docker) stays SQLite and needs none of this.
#
# Sequence: postgres starts -> bootstrap connects as the local
# superuser and creates the per-env database + a least-privilege login
# role, then applies the Alembic migrations as that role (see
# backend/app/bootstrap_db.py and backend/app/db/migrations.py) ->
# init_local re-checks the schema (a no-op at head) and seeds the demo
# account (see backend/app/db/init_local.py) -> app starts and connects
# as that limited role, and frontend (nginx) starts alongside it. The app
# itself does no database work at import.
#
# An existing postgres_data volume from before Alembic is stamped at the
# baseline revision on the next `up`, not recreated; data is kept.
#
# The `postgres` superuser credentials below are Compose-local dev
# defaults, not used anywhere outside this file.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  bootstrap:
    build:
      context: ./backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://hub_dev_user:hub_dev_password@postgres:5432/hub_dev
      MASTER_DB_HOST: postgres
      MASTER_DB_PORT: "5432"
      MASTER_DB_USER: postgres
      MASTER_DB_PASSWORD: postgres
    command: ["python", "-m", "app.bootstrap_db"]

  init_local:
    build:
      context: ./backend
      target: dev
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://hub_dev_user:hub_dev_password@postgres:5432/hub_dev
      SEED_DEMO_DATA: "true"
    command: ["python", "-m", "app.db.init_local"]

  app:
    build:
      context: ./backend
      target: dev
    depends_on:
      init_local:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://hub_dev_user:hub_dev_password@postgres:5432/hub_dev
      # HUB_JWT_SECRET intentionally left unset: ENVIRONMENT=local means
      # app/core/config.py falls back to the dev-only default and just
      # warns, same as a bare `uv run` with no .env.
      # The web app's origins: the Vite dev server (the default) and the
      # frontend service below. Also the allowlist for the login CSRF
      # check (backend/app/auth/csrf.py), so signing in on :8080 works.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  postgres_data:
