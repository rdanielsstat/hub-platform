# Manual reset of the seeded demo account. Deletes everything the demo user
# owns and re-seeds it, without touching any other account.
#
# Use it when reviewers have edited the demo data and you want it pristine
# again, or before sharing the link with a new audience.

name: Reset demo data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to reset
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: 'Type "reset" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TOFU_VERSION: 1.12.6

jobs:
  reset:
    if: inputs.confirm == 'reset'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_neon_urls: ${{ secrets.NEON_URLS }}
      TF_VAR_demo_passwords: ${{ secrets.DEMO_PASSWORDS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Reset
        working-directory: infra/hub
        run: |
          tofu init -input=false
          tofu workspace select ${{ inputs.environment }}
          FN=$(tofu output -raw bootstrap_function_name)
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"reset_demo": true}' \
            /tmp/reset.json
          cat /tmp/reset.json
          grep -q '"errorMessage"' /tmp/reset.json && exit 1 || true
