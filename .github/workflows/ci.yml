# Push to main: test everything, build one image, deploy it to dev.
# Production is never touched here. See promote.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # required to exchange the GitHub token for AWS credentials

env:
  AWS_REGION: us-east-1
  TOFU_VERSION: 1.12.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Ruff: lint, then formatting (fails on any finding or unformatted file).
      - name: Backend lint and format check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run

  # Backend integration tests (tests/integration/) against the Docker
  # Compose Postgres 17, the same image local `make test-integration` uses.
  # Each run migrates a throwaway database with the real Alembic scripts.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - name: Integration tests
        working-directory: backend
        run: uv run pytest -m integration -q

  # Playwright against the full Docker Compose stack (Postgres, bootstrap,
  # migrations, app on :8000), with Playwright starting Vite on :5173.
  # A gate for deploy-dev, like the integration job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the Compose stack
        run: make docker-up

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: E2E (browser and API)
        working-directory: frontend
        run: pnpm exec playwright test --project=chromium

      # Run alone, one worker: these stop and pause the Compose Postgres.
      - name: E2E (Compose stack, database outages)
        if: ${{ !cancelled() }}
        working-directory: frontend
        env:
          E2E_DOCKER: "1"
        run: pnpm exec playwright test --project=docker-compose --workers=1

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Known vulnerabilities in the locked dependencies, after the unit tests.
  # Gates the deploy on HIGH and CRITICAL; MODERATE and LOW only warn.
  # Backend: pip-audit over uv.lock (exported exactly as the image build
  # does); pip-audit gives no severities, so .github/scripts/pip_audit_gate.py
  # looks each finding up in OSV and fails on HIGH, CRITICAL, or a severity
  # it can't determine. Frontend: pnpm audit of production dependencies.
  dependency-scan:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Backend (pip-audit, fails on HIGH and above)
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          # pip-audit exits 1 when it finds anything; the gate decides what
          # blocks. Any other exit, or no report, means it didn't run.
          set +e
          uvx pip-audit==2.10.1 --disable-pip --no-deps \
            -r "$RUNNER_TEMP/requirements.txt" --format json -o "$RUNNER_TEMP/pip-audit.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ] || [ ! -s "$RUNNER_TEMP/pip-audit.json" ]; then
            echo "pip-audit did not complete (exit $status)"
            exit 1
          fi
          python3 ../.github/scripts/pip_audit_gate.py "$RUNNER_TEMP/pip-audit.json"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Frontend (pnpm audit, fails on high and above)
        working-directory: frontend
        run: |
          # Full report at every severity, for the log; never fails the job.
          pnpm audit --prod || true
          # The gate: non-zero only for high or critical (or if the audit can't run).
          pnpm audit --prod --audit-level high

  # Scan the whole git history for committed secrets on every PR and push.
  # The pre-commit hook only runs where someone installed it; this can't be
  # skipped. Reviewed false positives live in .gitleaksignore. Full history
  # rather than just the new commits: it takes seconds, and also catches a
  # secret that arrives through a rewritten or force-pushed history.
  secrets-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # checksums file. Bump both together (match .pre-commit-config.yaml).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan history
        # --redact: findings print without the secret value.
        run: gitleaks git --redact --no-banner --verbose .

  deploy-dev:
    # Every check gates the deploy: unit tests, the dependency scan, the
    # secrets scan, the Postgres integration tests and the Playwright E2E suite.
    needs: [test, dependency-scan, secrets-scan, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_neon_urls: ${{ secrets.NEON_URLS }}
      TF_VAR_demo_passwords: ${{ secrets.DEMO_PASSWORDS }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Grafana Cloud OTLP settings for the dev Lambda only (secrets on
      # the dev environment). promote.yml deliberately doesn't pass them.
      TF_VAR_otel_endpoint_dev: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT_DEV }}
      TF_VAR_otel_headers_dev: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS_DEV }}
      # Cloudflare's IP ranges, comma-separated: a variable (not a secret) on
      # this GitHub environment. Unset means trust no proxy. ops/DEPLOYMENT.md.
      TF_VAR_trusted_proxy_ips: ${{ vars.TRUSTED_PROXY_IPS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, for service-version.sh's git describe.
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # tag: the image tag, unique per build (promote.yml relies on that).
      # version: SemVer from the nearest vX.Y.Z git tag, for SERVICE_VERSION.
      - name: Compute image tag and version
        id: tag
        run: |
          echo "tag=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(bash .github/scripts/service-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Init and select workspace
        working-directory: infra/hub
        run: |
          tofu init -input=false
          tofu workspace select dev || tofu workspace new dev

      # Chicken and egg: a container-image Lambda cannot be created before its
      # image exists, and the image cannot be pushed before the repo exists.
      # So create the repo first, push, then apply everything.
      - name: Ensure ECR repository
        working-directory: infra/hub
        run: tofu apply -input=false -auto-approve -target=aws_ecr_repository.backend

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Build and push image
        working-directory: infra/hub
        run: |
          REPO=$(tofu output -raw ecr_repository_url)
          docker build --target prod -t "$REPO:${{ steps.tag.outputs.tag }}" ../../backend
          docker push "$REPO:${{ steps.tag.outputs.tag }}"

      # Migrations before code: first point only the bootstrap function at
      # the new image (a targeted apply also creates or updates whatever it
      # depends on), run it, and only then apply everything else, which
      # switches the API Lambda to the new code. A failed migration stops
      # the deploy here, with the old API still serving the old schema.
      - name: Update bootstrap function
        working-directory: infra/hub
        run: >-
          tofu apply -input=false -auto-approve
          -target=aws_lambda_function.bootstrap
          -var="lambda_image_tag=${{ steps.tag.outputs.tag }}"
          -var="service_version=${{ steps.tag.outputs.version }}"

      # Applies pending Alembic migrations (stamps a pre-Alembic database
      # first). Idempotent, runs every deploy; a failed migration fails it.
      - name: Bootstrap schema
        working-directory: infra/hub
        run: |
          FN=$(tofu output -raw bootstrap_function_name)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out /tmp/bootstrap.json
          cat /tmp/bootstrap.json
          grep -q '"errorMessage"' /tmp/bootstrap.json && exit 1 || true

      - name: Apply
        working-directory: infra/hub
        run: >-
          tofu apply -input=false -auto-approve
          -var="lambda_image_tag=${{ steps.tag.outputs.tag }}"
          -var="service_version=${{ steps.tag.outputs.version }}"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # VITE_API_BASE_URL is "/api" in every environment because the API is
      # same-origin behind CloudFront. The built artifact is therefore
      # identical for dev and prod.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy frontend
        working-directory: infra/hub
        run: |
          BUCKET=$(tofu output -raw frontend_bucket)
          DIST=$(tofu output -raw cloudfront_distribution_id)
          aws s3 sync ../../frontend/dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Smoke test
        working-directory: infra/hub
        run: |
          URL=$(tofu output -raw site_url)
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health") && [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check never returned 200"
          exit 1
