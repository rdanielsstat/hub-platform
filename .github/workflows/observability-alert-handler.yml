# On-call agent: wakes on a Grafana alert, diagnoses it with OpenAI,
# and rolls dev back to the previous image when the alert is on dev.
#
# Automatic path (repository_dispatch, event_type "grafana-alert"): the
# Grafana contact point (infra/hub/grafana.tf) posts the alert to
# GitHub's dispatches API, which starts this workflow on main with the
# alert as github.event.client_payload. No human starts or approves it.
#   1. triage    backend/oncall/alert.py reads the payload. Anything that
#                isn't a firing (or resolved) alert from a rule labeled
#                hub_oncall="true", for dev or prod, is ignored: the run
#                ends there and touches nothing.
#   2. record    finds or opens the tracking issue for the incident.
#   3. diagnose  one OpenAI call (OPENAI_API_KEY), posted on the issue.
#   4. rollback  dev only: rollback-dev.yml redeploys the previous dev
#                image, checks /api/health and comments the outcome on
#                the issue. At most one rollback per incident: a second
#                firing on the same open issue only gets a diagnosis.
#                Prod alerts are diagnosed and recorded, never rolled back.
#   5. resolved  a resolved notification is recorded on the issue.
#
# This workflow and rollback-dev.yml are the only place an agent may
# deploy, and only to dev. The Claude Code guard hook and the "never
# deploy" rule for interactive agents are unchanged (README.md,
# "On-Call Agent").
#
# Manual path (workflow_dispatch): diagnosis only, as before: paste an
# alert summary, a reviewer approves (the observability-oncall
# environment), one OpenAI call, no rollback. To roll dev back by hand,
# run rollback-dev.yml.
#
# Spend guard: backend/oncall/diagnose.py estimates the monthly cost
# (one call x runs_per_month) and skips the OpenAI call, with a warning,
# if that exceeds $5/month. It's an estimate; no billing API is queried.
#
# Model and prices default to gpt-4o-mini; override with the repo
# variables ONCALL_OPENAI_MODEL, ONCALL_INPUT_PRICE_PER_M and
# ONCALL_OUTPUT_PRICE_PER_M (USD per 1M tokens) when switching models.

name: Observability alert handler

on:
  repository_dispatch:
    types: [grafana-alert]
  workflow_dispatch:
    inputs:
      alert_summary:
        description: Alert to diagnose
        required: true
        type: string
        default: >-
          Project creation 5xx rate above 2%: projects_create_errors_total
          with http_status_code 5xx is 25% of projects_create_total over
          the last 5 minutes (normally 0), all HTTP 500s.
      runs_per_month:
        description: Expected runs per month, for the $5/month spend estimate
        required: true
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: observability-oncall
  cancel-in-progress: false

env:
  RUNS_PER_MONTH: "30"

jobs:
  diagnose-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: observability-oncall
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Diagnose alert
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONCALL_MODEL: ${{ vars.ONCALL_OPENAI_MODEL || 'gpt-4o-mini' }}
          ONCALL_INPUT_PRICE_PER_M: ${{ vars.ONCALL_INPUT_PRICE_PER_M || '0.15' }}
          ONCALL_OUTPUT_PRICE_PER_M: ${{ vars.ONCALL_OUTPUT_PRICE_PER_M || '0.60' }}
          ALERT_SUMMARY: ${{ inputs.alert_summary }}
          ONCALL_RUNS_PER_MONTH: ${{ inputs.runs_per_month }}
        run: python -m oncall.diagnose

  triage:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.decide.outputs.action }}
      environment: ${{ steps.decide.outputs.environment }}
      summary: ${{ steps.decide.outputs.summary }}
      title: ${{ steps.decide.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The payload is untrusted input: it reaches the script as an
      # environment variable, never interpolated into a shell command.
      - name: Decide
        id: decide
        working-directory: backend
        env:
          ALERT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python -m oncall.alert

  record:
    needs: triage
    if: needs.triage.outputs.action != 'ignore'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.issue.outputs.issue }}
      rolled_back: ${{ steps.issue.outputs.rolled_back }}
    steps:
      - name: Find or open the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.triage.outputs.title }}
          ACTION: ${{ needs.triage.outputs.action }}
          SUMMARY: ${{ needs.triage.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE=$(gh issue list --state open --label oncall --limit 50 \
            --json number,title --jq '.[] | select(.title == $ENV.TITLE) | .number' | head -n1)
          if [ -z "$ISSUE" ]; then
            if [ "$ACTION" = "resolved" ]; then
              echo "Resolved, but no open tracking issue for: $TITLE"
              echo "issue=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh label create oncall --color B60205 \
              --description "Opened by the on-call agent" 2>/dev/null || true
            URL=$(gh issue create --title "$TITLE" --label oncall --body "$(printf \
              'Opened by the on-call agent from a Grafana alert.\n\n**Alert:** %s\n\n**Run:** %s\n\nThe agent comments its diagnosis, any rollback and the resolution here. Close this issue once the cause is fixed.' \
              "$SUMMARY" "$RUN_URL")")
            ISSUE=${URL##*/}
          fi
          ROLLED_BACK=$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[].body | select(contains("<!-- oncall:rollback -->"))] | length')
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "rolled_back=$([ "$ROLLED_BACK" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Tracking issue #$ISSUE (rollbacks so far: $ROLLED_BACK)"

  diagnose:
    needs: [triage, record]
    if: needs.triage.outputs.action == 'rollback' || needs.triage.outputs.action == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Diagnose alert
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONCALL_MODEL: ${{ vars.ONCALL_OPENAI_MODEL || 'gpt-4o-mini' }}
          ONCALL_INPUT_PRICE_PER_M: ${{ vars.ONCALL_INPUT_PRICE_PER_M || '0.15' }}
          ONCALL_OUTPUT_PRICE_PER_M: ${{ vars.ONCALL_OUTPUT_PRICE_PER_M || '0.60' }}
          ALERT_SUMMARY: ${{ needs.triage.outputs.summary }} (environment ${{ needs.triage.outputs.environment }})
          ONCALL_RUNS_PER_MONTH: ${{ env.RUNS_PER_MONTH }}
          ONCALL_DIAGNOSIS_FILE: ${{ runner.temp }}/diagnosis.md
        run: python -m oncall.diagnose

      - name: Post the diagnosis
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.record.outputs.issue }}
          ACTION: ${{ needs.triage.outputs.action }}
          MODEL: ${{ vars.ONCALL_OPENAI_MODEL || 'gpt-4o-mini' }}
          DIAGNOSIS_FILE: ${{ runner.temp }}/diagnosis.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s "$DIAGNOSIS_FILE" ]; then DIAGNOSIS=$(cat "$DIAGNOSIS_FILE"); else DIAGNOSIS="No diagnosis (OpenAI call failed or skipped; see the run)."; fi
          if [ "$ACTION" = "rollback" ]; then NEXT="Next: rolling dev back to the previous image."; else NEXT="Prod: no automatic action. A human decides the fix and promotes it."; fi
          gh issue comment "$ISSUE" --body "$(printf '**Diagnosis** (OpenAI, %s)\n\n%s\n\n%s\n\nRun: %s' \
            "$MODEL" "$DIAGNOSIS" "$NEXT" "$RUN_URL")"

  rollback:
    needs: [triage, record, diagnose]
    # Even when the diagnosis failed: rolling back is what restores users.
    if: >-
      ${{ !cancelled()
      && needs.triage.outputs.action == 'rollback'
      && needs.triage.outputs.environment == 'dev'
      && needs.record.result == 'success'
      && needs.record.outputs.rolled_back == 'false' }}
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/rollback-dev.yml
    with:
      issue_number: ${{ needs.record.outputs.issue }}
      reason: ${{ needs.triage.outputs.summary }}
    secrets: inherit

  already-rolled-back:
    needs: [triage, record]
    if: needs.triage.outputs.action == 'rollback' && needs.record.outputs.rolled_back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Hand over to a human
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.record.outputs.issue }}
        run: |
          echo "::warning title=On-call::Already rolled back once for issue #$ISSUE; not rolling back again"
          gh issue comment "$ISSUE" --body "Still firing after a rollback. The agent rolls back once per incident, so it stops here: a human needs to look."

  resolved:
    needs: [triage, record]
    if: needs.triage.outputs.action == 'resolved' && needs.record.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record the resolution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.record.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --body "**Resolved:** Grafana reports the alert resolved at $(date -u +%Y-%m-%dT%H:%M:%SZ). Close this issue once the cause is understood."
